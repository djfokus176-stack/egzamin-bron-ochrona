name: Test aplikacji
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: node tests/mobile.cjs
      - run: node tests/firebase.cjs
      - run: node tests/billing.cjs
      - run: node --check account.js
      - run: node scripts/prepare-web.mjs
