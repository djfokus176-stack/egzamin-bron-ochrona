name: Zrzuty ekranu Google Play
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-screenshots.yml'
      - 'index.html'
      - 'manifest.webmanifest'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture real app on a phone-sized viewport
        run: node scripts/capture_store.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-ochrona-play-screenshots
          path: store/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
